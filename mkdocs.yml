site_name: HLA Registry Analysis — Singapore CMIO Population
site_description: Reproducible HLA allele/haplotype frequency analysis and registry size modelling for Singapore CMIO populations.
docs_dir: docs

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Overview: index.md
  - Technical Documentation: documentation.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true          # protects math blocks before Markdown parsing — _ only active inside $...$
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
